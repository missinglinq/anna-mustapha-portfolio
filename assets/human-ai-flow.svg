<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="t d"><title id="t">ParcelTrace human and AI workflow visualization</title><desc id="d">A four-step workflow showing AI assemble, AI explain, researcher verify, and human approve.</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#231f31"/><stop offset="1" stop-color="#17141f"/></linearGradient><filter id="s" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="18" stdDeviation="24" flood-color="#0b0912" flood-opacity=".35"/></filter></defs><rect width="1200" height="760" rx="40" fill="#f2edf6"/><rect x="80" y="70" width="1040" height="620" rx="30" fill="url(#bg)" filter="url(#s)"/><text x="125" y="130" fill="#bba7de" font-family="Inter,Arial" font-size="20" font-weight="700" letter-spacing="2">HUMAN + AI WORKFLOW</text><text x="125" y="182" fill="#fff" font-family="Inter,Arial" font-size="34" font-weight="700">Automate repetition. Preserve judgment.</text><text x="125" y="218" fill="#c4bbc9" font-family="Inter,Arial" font-size="18">The system narrows the field; people remain accountable for consequential decisions.</text><g font-family="Inter,Arial"><rect x="125" y="305" width="215" height="225" rx="22" fill="#2b2539" stroke="#4d435d"/><circle cx="170" cy="350" r="20" fill="#6f4ca8"/><text x="170" y="357" text-anchor="middle" fill="#fff" font-size="16" font-weight="700">1</text><text x="150" y="405" fill="#fff" font-size="24" font-weight="700">Assemble</text><text x="150" y="440" fill="#c4bbc9" font-size="16">Retrieve prior work,</text><text x="150" y="465" fill="#c4bbc9" font-size="16">ingest records, compare.</text><text x="150" y="505" fill="#b79ddd" font-size="14" font-weight="700">AI ASSISTS</text><rect x="370" y="305" width="215" height="225" rx="22" fill="#2b2539" stroke="#4d435d"/><circle cx="415" cy="350" r="20" fill="#6f4ca8"/><text x="415" y="357" text-anchor="middle" fill="#fff" font-size="16" font-weight="700">2</text><text x="395" y="405" fill="#fff" font-size="24" font-weight="700">Explain</text><text x="395" y="440" fill="#c4bbc9" font-size="16">Show changes, conflicts,</text><text x="395" y="465" fill="#c4bbc9" font-size="16">confidence, evidence.</text><text x="395" y="505" fill="#b79ddd" font-size="14" font-weight="700">AI ASSISTS</text><rect x="615" y="305" width="215" height="225" rx="22" fill="#302a36" stroke="#675675"/><circle cx="660" cy="350" r="20" fill="#c29f62"/><text x="660" y="357" text-anchor="middle" fill="#1d1720" font-size="16" font-weight="700">3</text><text x="640" y="405" fill="#fff" font-size="24" font-weight="700">Verify</text><text x="640" y="440" fill="#c4bbc9" font-size="16">Investigate ambiguity</text><text x="640" y="465" fill="#c4bbc9" font-size="16">and exceptions.</text><text x="640" y="505" fill="#e7c47d" font-size="14" font-weight="700">RESEARCHER</text><rect x="860" y="305" width="215" height="225" rx="22" fill="#33293e" stroke="#7e6297"/><circle cx="905" cy="350" r="20" fill="#d1b8ef"/><text x="905" y="357" text-anchor="middle" fill="#211929" font-size="16" font-weight="700">4</text><text x="885" y="405" fill="#fff" font-size="24" font-weight="700">Approve</text><text x="885" y="440" fill="#c4bbc9" font-size="16">Make the consequential</text><text x="885" y="465" fill="#c4bbc9" font-size="16">call and preserve it.</text><text x="885" y="505" fill="#d1b8ef" font-size="14" font-weight="700">HUMAN CONTROL</text><path d="M340 417 H370 M585 417 H615 M830 417 H860" stroke="#8f78ad" stroke-width="4" stroke-linecap="round"/><path d="M355 408 l15 9 -15 9 M600 408 l15 9 -15 9 M845 408 l15 9 -15 9" fill="none" stroke="#8f78ad" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/></g><text x="125" y="610" fill="#d8d0df" font-family="Inter,Arial" font-size="18">AI helps reduce repetition. People own ambiguity, sufficiency, and approval.</text></svg>