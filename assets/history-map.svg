<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="t d"><title id="t">ParcelTrace property history visualization</title><desc id="d">A stylized property record timeline showing a verified baseline, a new record signal, and a human review decision.</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#201c2d"/><stop offset="1" stop-color="#171522"/></linearGradient><linearGradient id="v" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#9b78d2"/><stop offset="1" stop-color="#6f4ca8"/></linearGradient><filter id="s" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="18" stdDeviation="24" flood-color="#0b0912" flood-opacity=".35"/></filter></defs><rect width="1200" height="760" rx="40" fill="#f3eff7"/><rect x="80" y="70" width="1040" height="620" rx="30" fill="url(#bg)" filter="url(#s)"/><text x="125" y="130" fill="#bba7de" font-family="Inter,Arial" font-size="20" font-weight="700" letter-spacing="2">PROPERTY 360 · HISTORY</text><text x="125" y="185" fill="#fff" font-family="Inter,Arial" font-size="38" font-weight="700">1432 Cypress Ave.</text><text x="125" y="220" fill="#b8afc2" font-family="Inter,Arial" font-size="18">Synthetic property example · persistent record history</text><line x1="190" y1="390" x2="1010" y2="390" stroke="#5b5369" stroke-width="4"/><circle cx="240" cy="390" r="28" fill="#7fb99f"/><circle cx="585" cy="390" r="28" fill="#e4bd72"/><circle cx="930" cy="390" r="28" fill="url(#v)"/><rect x="145" y="455" width="260" height="120" rx="18" fill="#292438" stroke="#4a4359"/><text x="170" y="495" fill="#8fd0b2" font-family="Inter,Arial" font-size="17" font-weight="700">VERIFIED BASELINE</text><text x="170" y="530" fill="#fff" font-family="Inter,Arial" font-size="22" font-weight="700">Jordan Ellis</text><text x="170" y="560" fill="#b8afc2" font-family="Inter,Arial" font-size="16">Prior work preserved</text><rect x="470" y="260" width="260" height="120" rx="18" fill="#302719" stroke="#6f5a32"/><text x="495" y="300" fill="#f0cc86" font-family="Inter,Arial" font-size="17" font-weight="700">NEW SIGNAL</text><text x="495" y="335" fill="#fff" font-family="Inter,Arial" font-size="22" font-weight="700">J. Ellis Estate</text><text x="495" y="365" fill="#cdbf9e" font-family="Inter,Arial" font-size="16">Possible conflict detected</text><rect x="800" y="455" width="260" height="120" rx="18" fill="#2b243d" stroke="#6e5599"/><text x="825" y="495" fill="#cdb8ef" font-family="Inter,Arial" font-size="17" font-weight="700">HUMAN REVIEW</text><text x="825" y="530" fill="#fff" font-family="Inter,Arial" font-size="22" font-weight="700">Targeted delta</text><text x="825" y="560" fill="#b8afc2" font-family="Inter,Arial" font-size="16">Investigate only what changed</text><path d="M585 390 C675 320 780 320 930 390" fill="none" stroke="#9b78d2" stroke-width="5" stroke-dasharray="10 11"/><text x="125" y="640" fill="#d7cfdf" font-family="Inter,Arial" font-size="18">Preserve what was verified → compare the new signal → send ambiguity to a person.</text></svg>