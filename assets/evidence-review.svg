<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="t d"><title id="t">ParcelTrace evidence review visualization</title><desc id="d">A stylized evidence review interface showing multiple supporting sources, one conflicting record, confidence, and a human review route.</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#201c2d"/><stop offset="1" stop-color="#15131f"/></linearGradient><filter id="s" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="18" stdDeviation="24" flood-color="#0b0912" flood-opacity=".35"/></filter></defs><rect width="1200" height="760" rx="40" fill="#f4f0f7"/><rect x="80" y="70" width="1040" height="620" rx="30" fill="url(#bg)" filter="url(#s)"/><text x="125" y="130" fill="#bba7de" font-family="Inter,Arial" font-size="20" font-weight="700" letter-spacing="2">EVIDENCE REVIEW</text><text x="125" y="182" fill="#fff" font-family="Inter,Arial" font-size="34" font-weight="700">Make disagreement visible.</text><text x="125" y="215" fill="#b8afc2" font-family="Inter,Arial" font-size="18">Supporting systems are context. Conflicts stay visible until a person resolves them.</text><g font-family="Inter,Arial"><rect x="125" y="275" width="600" height="72" rx="14" fill="#282334"/><text x="150" y="305" fill="#c8c0ce" font-size="16">Verified baseline</text><text x="150" y="332" fill="#fff" font-size="21" font-weight="700">Jordan Ellis</text><text x="620" y="319" fill="#8fd0b2" font-size="16" font-weight="700">VERIFIED</text><rect x="125" y="360" width="600" height="72" rx="14" fill="#282334"/><text x="150" y="390" fill="#c8c0ce" font-size="16">Assessor record</text><text x="150" y="417" fill="#fff" font-size="21" font-weight="700">Jordan Ellis</text><text x="594" y="404" fill="#b8afc2" font-size="16">SUPPORTING</text><rect x="125" y="445" width="600" height="72" rx="14" fill="#282334"/><text x="150" y="475" fill="#c8c0ce" font-size="16">Permit owner</text><text x="150" y="502" fill="#fff" font-size="21" font-weight="700">Jordan A. Ellis</text><text x="596" y="489" fill="#c7b5e6" font-size="16">LIKELY MATCH</text><rect x="125" y="530" width="600" height="88" rx="14" fill="#392d1e" stroke="#8a6839" stroke-width="2"/><text x="150" y="560" fill="#e8c987" font-size="16">New extracted record</text><text x="150" y="591" fill="#fff" font-size="22" font-weight="700">J. Ellis Estate</text><text x="562" y="580" fill="#f0c878" font-size="16" font-weight="700">REVIEW</text><rect x="770" y="275" width="290" height="343" rx="20" fill="#262032" stroke="#4b405f"/><text x="805" y="315" fill="#bba7de" font-size="16" font-weight="700">AI RESEARCH BRIEF</text><text x="805" y="365" fill="#fff" font-size="25" font-weight="700">Possible identity</text><text x="805" y="397" fill="#fff" font-size="25" font-weight="700">discrepancy</text><text x="805" y="445" fill="#c5bdcc" font-size="17">One new source conflicts with</text><text x="805" y="472" fill="#c5bdcc" font-size="17">the verified baseline.</text><rect x="805" y="515" width="220" height="58" rx="12" fill="#7050a6"/><text x="915" y="552" text-anchor="middle" fill="#fff" font-size="16" font-weight="700">Send to researcher</text></g></svg>